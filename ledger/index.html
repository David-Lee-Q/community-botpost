<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>社区内容自运营智能体</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #f5f7fa; --card: #fff; --border: #e4e7ed; --text: #303133;
    --muted: #909399; --primary: #2f6fed; --accent: #19be6b;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--text); }
  header { background: linear-gradient(135deg, #1f3b8f, #2f6fed); color: #fff; padding: 20px 28px; display: flex; align-items: center; flex-wrap: wrap; gap: 12px; }
  header h1 { font-size: 22px; font-weight: 600; }
  header .sub { font-size: 13px; opacity: .85; margin-top: 6px; flex-basis: 100%; }
  .score-tag {
    display: inline-block; margin-left: auto; padding: 6px 18px; border-radius: 20px;
    font-size: 15px; font-weight: 700; color: #1f3b8f; background: linear-gradient(135deg, #ffe066, #ffc53d);
    box-shadow: 0 2px 10px rgba(0,0,0,.25); cursor: pointer; user-select: none;
    animation: breathe 2.2s ease-in-out infinite;
  }
  .score-tag:hover { animation-play-state: paused; transform: scale(1.06); }
  @keyframes breathe {
    0%, 100% { box-shadow: 0 0 0 0 rgba(255, 214, 64, .55), 0 2px 10px rgba(0,0,0,.25); }
    50% { box-shadow: 0 0 0 12px rgba(255, 214, 64, 0), 0 4px 14px rgba(0,0,0,.3); }
  }
  .modal-mask { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 100; align-items: center; justify-content: center; }
  .modal-mask.show { display: flex; }
  .modal { background: #fff; border-radius: 12px; width: min(560px, 92vw); max-height: 84vh; overflow: auto; padding: 22px 26px; box-shadow: 0 10px 40px rgba(0,0,0,.3); }
  .modal h3 { font-size: 18px; margin-bottom: 4px; }
  .modal .meta { font-size: 12px; color: var(--muted); margin-bottom: 14px; }
  .modal .close { float: right; cursor: pointer; font-size: 22px; line-height: 1; color: var(--muted); }
  .dim-bar { display: flex; align-items: center; gap: 10px; margin: 8px 0; font-size: 13px; }
  .dim-bar .name { width: 84px; flex-shrink: 0; color: var(--text); }
  .dim-bar .track { flex: 1; height: 10px; background: #eee; border-radius: 5px; overflow: hidden; }
  .dim-bar .fill { height: 100%; border-radius: 5px; background: linear-gradient(90deg, #2f6fed, #19be6b); }
  .dim-bar .val { width: 40px; text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
  .modal .weak { color: #f56c6c; }
  .sugg { margin: 10px 0; padding: 10px 12px; border-left: 3px solid #f59e0b; background: #fff7e6; border-radius: 4px; font-size: 13px; line-height: 1.6; }
  .seg { display: inline-flex; gap: 2px; vertical-align: 3px; margin-left: 8px; }
  .seg button { padding: 3px 12px; font-size: 12px; border: 1px solid var(--border); background: #fff; color: var(--muted); cursor: pointer; border-radius: 4px; }
  .seg button.active { background: var(--primary); color: #fff; border-color: var(--primary); }
  .panel h2 { display: flex; align-items: center; flex-wrap: wrap; }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 20px 16px 60px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: 20px; }
  .card { position: relative; background: linear-gradient(180deg, #fff, #f7f9fc); border: 1px solid var(--border); border-radius: 12px; padding: 18px; box-shadow: 0 2px 6px rgba(31,59,143,.06), 0 8px 20px rgba(31,59,143,.08); transition: transform .25s ease, box-shadow .25s ease; overflow: hidden; }
  .card:hover { transform: translateY(-5px); box-shadow: 0 6px 14px rgba(31,59,143,.12), 0 18px 34px rgba(31,59,143,.18); }
  .card-icon { width: 42px; height: 42px; border-radius: 10px; background: linear-gradient(135deg, #4a86ff, #1f3b8f); display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(47,111,237,.35), inset 0 1px 0 rgba(255,255,255,.4), inset 0 -2px 4px rgba(0,0,0,.18); margin-bottom: 12px; transition: transform .25s ease, box-shadow .25s ease; }
  .card:hover .card-icon { transform: translateY(-2px) scale(1.08); box-shadow: 0 8px 18px rgba(47,111,237,.45), inset 0 1px 0 rgba(255,255,255,.4), inset 0 -2px 4px rgba(0,0,0,.18); }
  .card-icon svg { width: 22px; height: 22px; fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 1px 1px rgba(0,0,0,.3)); }
  .card .label { font-size: 13px; color: var(--muted); }
  .card .value { font-size: 30px; font-weight: 700; margin-top: 6px; color: var(--primary); }
  .card .extra { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .panel { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 18px; margin-bottom: 20px; }
  .panel h2 { font-size: 16px; margin-bottom: 14px; font-weight: 600; }
  .charts { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .charts .panel:nth-child(3n) { grid-column: 1 / -1; }
  .chart-box { position: relative; height: 300px; }
  @media (max-width: 800px) { .charts { grid-template-columns: 1fr; } .charts .panel:nth-child(3n) { grid-column: auto; } }
  .filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
  .filters select, .filters input { padding: 7px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; background: #fff; }
  .filters input { flex: 1; min-width: 200px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th { background: #fafafa; color: var(--muted); font-weight: 600; position: sticky; top: 0; }
  tbody tr:hover { background: #f0f6ff; }
  td.title { white-space: normal; min-width: 260px; max-width: 420px; }
  td.title a { color: var(--primary); text-decoration: none; }
  td.title a:hover { text-decoration: underline; }
  .tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 12px; background: #ecf5ff; color: var(--primary); }
  .tag.s { background: #fef0f0; color: #f56c6c; }
  .tag.g { background: #f0f9eb; color: #67c23a; }
  .tag.o { background: #fdf6ec; color: #e6a23c; }
  .num { text-align: right; color: var(--muted); }
  .pager { display: flex; justify-content: center; gap: 8px; margin-top: 14px; align-items: center; }
  .pager button { padding: 6px 14px; border: 1px solid var(--border); border-radius: 6px; background: #fff; cursor: pointer; font-size: 13px; }
  .pager button:disabled { opacity: .4; cursor: not-allowed; }
  .pager span { font-size: 13px; color: var(--muted); }
  .empty { text-align: center; color: var(--muted); padding: 40px 0; }
</style>
</head>
<body>
<header>
  <h1>社区内容自运营智能体</h1>
  <span class="score-tag" id="scoreTag" title="点击查看下周优化建议">综合评分 —</span>
  <div class="sub" id="sub">加载中...</div>
</header>

<div class="modal-mask" id="modalMask">
  <div class="modal">
    <span class="close" id="modalClose">&times;</span>
    <h3 id="modalTitle">下周优化建议</h3>
    <div class="meta" id="modalMeta"></div>
    <div id="modalBody"></div>
  </div>
</div>

<div class="wrap">
  <div class="cards">
    <div class="card"><div class="card-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></div><div class="label">历史累计</div><div class="value" id="statTotal">-</div><div class="extra">账号全部发文</div></div>
    <div class="card"><div class="card-icon"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M3 9h18"/></svg></div><div class="label">本月发布</div><div class="value" id="statMonth">-</div><div class="extra" id="statMonthExtra"></div></div>
    <div class="card"><div class="card-icon"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M3 9h18"/><circle cx="12" cy="14" r="1.5"/></svg></div><div class="label">本周发布</div><div class="value" id="statWeek">-</div><div class="extra" id="statWeekExtra"></div></div>
    <div class="card"><div class="card-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/></svg></div><div class="label">今日发布</div><div class="value" id="statToday">-</div><div class="extra" id="statTodayExtra"></div></div>
  </div>

  <div class="charts">
    <div class="panel"><h2>每日发布量（近30天）</h2><div class="chart-box"><canvas id="chartDaily"></canvas></div></div>
    <div class="panel"><h2>每周发布量（近12周）</h2><div class="chart-box"><canvas id="chartWeekly"></canvas></div></div>
    <div class="panel"><h2>每月发布量（近12个月）</h2><div class="chart-box"><canvas id="chartMonthly"></canvas></div></div>
    <div class="panel"><h2>分类分布</h2><div class="chart-box"><canvas id="chartCate"></canvas></div></div>
    <div class="panel"><h2>分类发布趋势（近6个月）</h2><div class="chart-box"><canvas id="chartTrend"></canvas></div></div>
    <div class="panel"><h2>文章评价分数趋势 <span class="seg">
      <button data-kind="score" data-p="day" class="active">按日</button>
      <button data-kind="score" data-p="week">按周</button>
      <button data-kind="score" data-p="month">按月</button></span></h2>
      <div class="chart-box"><canvas id="chartScore"></canvas></div></div>
    <div class="panel"><h2>浏览次数趋势 <span class="seg">
      <button data-kind="views" data-p="day" class="active">按日</button>
      <button data-kind="views" data-p="week">按周</button>
      <button data-kind="views" data-p="month">按月</button></span></h2>
      <div class="chart-box"><canvas id="chartViews"></canvas></div></div>
    <div class="panel"><h2>互动次数趋势 <span class="seg">
      <button data-kind="engage" data-p="day" class="active">按日</button>
      <button data-kind="engage" data-p="week">按周</button>
      <button data-kind="engage" data-p="month">按月</button></span></h2>
      <div class="chart-box"><canvas id="chartEngage"></canvas></div></div>
  </div>

  <div class="panel">
    <h2>发布台账明细</h2>
    <div class="filters">
      <input id="searchInput" placeholder="搜索标题关键词...">
      <select id="cateFilter"><option value="">全部分类</option></select>
      <select id="periodFilter">
        <option value="">全部时间</option>
        <option value="today">今日</option>
        <option value="week">本周</option>
        <option value="month">本月</option>
      </select>
      <span style="font-size:13px;color:var(--muted)" id="countInfo"></span>
    </div>
    <div style="max-height:520px;overflow:auto">
      <table>
        <thead><tr>
          <th>标题</th><th>分类</th><th>发布时间</th><th>状态</th><th>评价</th>
          <th class="num">浏览</th><th class="num">评论</th><th class="num">点赞</th><th class="num">收藏</th>
        </tr></thead>
        <tbody id="tbody"></tbody>
      </table>
      <div class="empty" id="empty" style="display:none">暂无文章</div>
    </div>
    <div class="pager">
      <button id="prevBtn" disabled>上一页</button>
      <span id="pageInfo"></span>
      <button id="nextBtn">下一页</button>
    </div>
  </div>
</div>

<script>
const PAGE_SIZE = 20;
let ARTICLES = [];
let REVIEWS = {};
let SCORE = null;
let filtered = [];
let page = 1;
let charts = {};

function fmtNum(n) { return n == null ? 0 : Number(n).toLocaleString(); }

function dateStr(iso) {
  return iso ? iso.slice(0, 10) : '';
}
function weekOf(iso) {
  const d = new Date(iso.slice(0, 10) + 'T00:00:00');
  const day = (d.getDay() + 6) % 7;
  const monday = new Date(d); monday.setDate(d.getDate() - day);
  return monday;
}
function fillBuckets(buckets, from, to, stepFn) {
  const out = [];
  for (let cur = new Date(from); cur <= to; ) {
    const key = stepFn(cur);
    out.push({ key, count: buckets.get(key) || 0 });
    if (stepFn.name.includes('Week')) cur.setDate(cur.getDate() + 7);
    else if (stepFn.name.includes('Month')) cur.setMonth(cur.getMonth() + 1);
    else cur.setDate(cur.getDate() + 1);
  }
  return out;
}

function parseData(json) {
  ARTICLES = json.articles || [];
  const cats = json.categories || {};
  // 分类下拉
  const cateSel = document.getElementById('cateFilter');
  const used = [...new Set(ARTICLES.map(a => a.cateName || '未分类'))].sort();
  used.forEach(c => {
    const opt = document.createElement('option');
    opt.value = c; opt.textContent = c;
    cateSel.appendChild(opt);
  });
  renderAll();
}

function calcStats() {
  const now = new Date();
  const today = now.toISOString().slice(0, 10);
  const wd = (now.getDay() + 6) % 7;
  const weekStart = new Date(now); weekStart.setDate(now.getDate() - wd);
  const ws = weekStart.toISOString().slice(0, 10);
  const ms = now.toISOString().slice(0, 7);

  let m = 0, w = 0, t = 0;
  ARTICLES.forEach(a => {
    const d = dateStr(a.createTime);
    if (!d) return;
    if (d === today) t++;
    if (d >= ws && d <= today) w++;
    if (d.slice(0, 7) === ms) m++;
  });
  document.getElementById('statTotal').textContent = fmtNum(ARTICLES.length);
  document.getElementById('statMonth').textContent = fmtNum(m);
  document.getElementById('statWeek').textContent = fmtNum(w);
  document.getElementById('statToday').textContent = fmtNum(t);
  const months = [...new Set(ARTICLES.map(a => dateStr(a.createTime).slice(0, 7)).filter(Boolean))].sort();
  const latest = months[months.length - 1] || '-';
  document.getElementById('statMonthExtra').textContent = latest + ' 当月';
  document.getElementById('statTodayExtra').textContent = today;
}

function makeChart(id, cfg) {
  if (charts[id]) charts[id].destroy();
  charts[id] = new Chart(document.getElementById(id), cfg);
}

function fmtLocal(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}
function addDays(d, n) { const r = new Date(d); r.setDate(r.getDate() + n); return r; }
function addWeeks(d, n) { const r = new Date(d); r.setDate(r.getDate() + n * 7); return r; }
function addMonths(d, n) { const r = new Date(d.getFullYear(), d.getMonth() + n, 1); return r; }
function mondayOf(d) {
  const r = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  r.setDate(r.getDate() - ((r.getDay() + 6) % 7));
  return r;
}
function monthKey(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`; }

function renderCharts() {
  const now = new Date();
  const cateCount = new Map();
  const catTrend = new Map();
  const byDay = new Map();
  const byWeek = new Map();
  const byMonth = new Map();

  ARTICLES.forEach(a => {
    const iso = a.createTime;
    if (!iso) return;
    const d = dateStr(iso);
    if (!d) return;
    const dt = new Date(d + 'T00:00:00');
    byDay.set(d, (byDay.get(d) || 0) + 1);
    const mk = fmtLocal(mondayOf(dt));
    byWeek.set(mk, (byWeek.get(mk) || 0) + 1);
    const ym = d.slice(0, 7);
    byMonth.set(ym, (byMonth.get(ym) || 0) + 1);
    const cn = a.cateName || '未分类';
    cateCount.set(cn, (cateCount.get(cn) || 0) + 1);
    if (!catTrend.has(cn)) catTrend.set(cn, {});
    catTrend.get(cn)[ym] = (catTrend.get(cn)[ym] || 0) + 1;
  });

  // 近30天（自然日）
  const dayBuckets = [];
  for (let i = 29; i >= 0; i--) {
    const dt = addDays(now, -i);
    const key = fmtLocal(dt);
    dayBuckets.push({ key, label: key.slice(5), v: byDay.get(key) || 0 });
  }
  makeChart('chartDaily', {
    type: 'bar',
    data: { labels: dayBuckets.map(b => b.label), datasets: [{ label: '发布量', data: dayBuckets.map(b => b.v), backgroundColor: '#2f6fed', borderRadius: 3 }] },
    options: chartOpts('文章数')
  });

  // 近12周（自然周：周一~周日，横坐标标记自然周最后一天=周日）
  const thisMonday = mondayOf(now);
  const weekBuckets = [];
  for (let i = 11; i >= 0; i--) {
    const m = addWeeks(thisMonday, -i);
    const sunday = addDays(m, 6);
    weekBuckets.push({ key: fmtLocal(m), label: fmtLocal(sunday).slice(5), v: byWeek.get(fmtLocal(m)) || 0 });
  }
  makeChart('chartWeekly', {
    type: 'bar',
    data: { labels: weekBuckets.map(b => b.label), datasets: [{ label: '发布量', data: weekBuckets.map(b => b.v), backgroundColor: '#19be6b', borderRadius: 3 }] },
    options: chartOpts('文章数')
  });

  // 近12个月（自然月）
  const monthBuckets = [];
  for (let i = 11; i >= 0; i--) {
    const m = addMonths(now, -i);
    const key = monthKey(m);
    monthBuckets.push({ key, label: key, v: byMonth.get(key) || 0 });
  }
  makeChart('chartMonthly', {
    type: 'line',
    data: { labels: monthBuckets.map(b => b.label), datasets: [{ label: '发布量', data: monthBuckets.map(b => b.v), borderColor: '#f59e0b', backgroundColor: 'rgba(245,158,11,.15)', fill: true, tension: .35 }] },
    options: chartOpts('文章数')
  });

  // 分类分布（取前12大 + 其他）
  const sorted = [...cateCount.entries()].sort((a, b) => b[1] - a[1]);
  const top = sorted.slice(0, 12);
  const rest = sorted.slice(12).reduce((s, x) => s + x[1], 0);
  if (rest > 0) top.push(['其他', rest]);
  const palette = ['#2f6fed','#19be6b','#f59e0b','#f56c6c','#9b59b6','#00b5ad','#e67e22','#34495e','#1abc9c','#e84393','#16a085','#d35400','#7f8c8d'];
  makeChart('chartCate', {
    type: 'doughnut',
    data: { labels: top.map(d => d[0]), datasets: [{ data: top.map(d => d[1]), backgroundColor: palette.slice(0, top.length) }] },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'right' } } }
  });

  // 分类趋势（近6个月，top8）
  const mOrder6 = [];
  for (let i = 5; i >= 0; i--) mOrder6.push(monthKey(addMonths(now, -i)));
  const sumArr = obj => Object.values(obj).reduce((s, x) => s + x, 0);
  const trendSorted = [...catTrend.entries()].sort((a, b) => sumArr(b[1]) - sumArr(a[1])).slice(0, 8);
  makeChart('chartTrend', {
    type: 'line',
    data: {
      labels: mOrder6,
      datasets: trendSorted.map((c, i) => ({
        label: c[0], data: mOrder6.map(m => c[1][m] || 0),
        borderColor: palette[i % palette.length], tension: .35, pointRadius: 2,
      }))
    },
    options: chartOpts('文章数')
  });

  renderTrendChart('score');
  renderTrendChart('views');
  renderTrendChart('engage');
}

const PERIOD_COUNT = { day: 30, week: 12, month: 12 };
const PERIOD_OFFSET = { day: 365, week: 52, month: 12 };
const currentPeriod = { score: 'day', views: 'day', engage: 'day' };

function buildPeriodBuckets(period) {
  const n = PERIOD_COUNT[period];
  const off = PERIOD_OFFSET[period];
  const now = new Date();
  let anchor;
  if (period === 'month') anchor = new Date(now.getFullYear(), now.getMonth(), 1);
  else if (period === 'week') anchor = mondayOf(now);
  else anchor = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const total = n + off;
  const keys = [], labels = [], bIdx = {};
  for (let i = total - 1; i >= 0; i--) {
    let d = period === 'day' ? addDays(anchor, -i)
          : period === 'week' ? addWeeks(anchor, -i)
          : addMonths(anchor, -i);
    const wk = period === 'week' ? mondayOf(d) : d;
    const key = period === 'month' ? monthKey(d) : fmtLocal(wk);
    const pos = keys.length;
    keys.push(key);
    labels.push(period === 'week' ? fmtLocal(addDays(wk, 6)).slice(5)
              : period === 'month' ? key : key.slice(5));
    bIdx[key] = pos;
  }
  return { n, off, keys, labels, bIdx };
}

function buildRates(vals, off) {
  const yoy = vals.map((v, i) => {
    if (v == null || i - off < 0) return null;
    const p = vals[i - off];
    if (p == null || p === 0) return null;
    return +((v - p) / p * 100).toFixed(1);
  });
  const mom = vals.map((v, i) => {
    if (v == null || i < 1) return null;
    const p = vals[i - 1];
    if (p == null || p === 0) return null;
    return +((v - p) / p * 100).toFixed(1);
  });
  return { yoy, mom };
}

function renderTrendChart(kind) {
  const period = currentPeriod[kind];
  const { n, off, labels, bIdx } = buildPeriodBuckets(period);
  const total = n + off;
  const scoreSum = new Array(total).fill(0);
  const scoreCnt = new Array(total).fill(0);
  const viewSum = new Array(total).fill(0);
  const engageSum = new Array(total).fill(0);
  ARTICLES.forEach(a => {
    const iso = a.createTime;
    if (!iso) return;
    const d = dateStr(iso);
    if (!d) return;
    const dt = new Date(d + 'T00:00:00');
    const key = period === 'month' ? d.slice(0, 7)
              : period === 'week' ? fmtLocal(mondayOf(dt)) : d;
    const i = bIdx[key];
    if (i == null) return;
    viewSum[i] += (a.viewCount || 0);
    engageSum[i] += (a.commentCount || 0) + (a.favor || 0) + (a.collect || 0);
    const rv = REVIEWS[a.id];
    if (rv && typeof rv.score === 'number') { scoreSum[i] += rv.score; scoreCnt[i]++; }
  });
  const scoreVals = scoreSum.map((s, i) => scoreCnt[i] ? +(s / scoreCnt[i]).toFixed(1) : null);
  const base = kind === 'score' ? scoreVals : kind === 'views' ? viewSum : engageSum;
  const { yoy, mom } = buildRates(base, off);
  const show = base.slice(off);
  const showYoy = yoy.slice(off);
  const showMom = mom.slice(off);

  const mainLabel = kind === 'score' ? '平均评价分' : kind === 'views' ? '浏览次数' : '互动次数';
  const datasets = [{
    label: mainLabel,
    data: show, borderColor: '#2f6fed', backgroundColor: 'rgba(47,111,237,.12)',
    fill: true, tension: .35, pointRadius: 2, yAxisID: 'y'
  }];
  if (showYoy.some(v => v != null)) {
    datasets.push({ label: '同比', data: showYoy, borderColor: '#e84393', tension: .3, pointRadius: 0, borderDash: [5, 3], yAxisID: 'y2' });
  }
  if (showMom.some(v => v != null)) {
    datasets.push({ label: '环比', data: showMom, borderColor: '#00b5ad', tension: .3, pointRadius: 0, borderDash: [2, 2], yAxisID: 'y2' });
  }
  const canvasId = kind === 'score' ? 'chartScore' : kind === 'views' ? 'chartViews' : 'chartEngage';
  makeChart(canvasId, {
    type: 'line',
    data: { labels: labels.slice(off), datasets },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { labels: { font: { size: 11 } } } },
      scales: {
        y: { beginAtZero: false, title: { display: true, text: mainLabel } },
        y2: { position: 'right', title: { display: true, text: '同比/环比 %' }, grid: { drawOnChartArea: false } },
        x: { ticks: { maxTicksLimit: 15, font: { size: 10 } } }
      }
    }
  });
}

function chartOpts(yLabel) {
  return {
    responsive: true, maintainAspectRatio: false,
    plugins: { legend: { display: true, labels: { font: { size: 11 } } } },
    scales: {
      y: { beginAtZero: true, ticks: { precision: 0 }, title: { display: true, text: yLabel } },
      x: { ticks: { maxTicksLimit: 15, font: { size: 10 } } }
    }
  };
}

function applyFilters() {
  const kw = document.getElementById('searchInput').value.trim().toLowerCase();
  const cate = document.getElementById('cateFilter').value;
  const period = document.getElementById('periodFilter').value;
  const now = new Date();
  const today = now.toISOString().slice(0, 10);
  const wd = (now.getDay() + 6) % 7;
  const ws = new Date(now); ws.setDate(now.getDate() - wd);
  const wstart = ws.toISOString().slice(0, 10);
  const ms = now.toISOString().slice(0, 7);

  filtered = ARTICLES.filter(a => {
    if (kw && !(a.title || '').toLowerCase().includes(kw)) return false;
    if (cate && a.cateName !== cate) return false;
    const d = dateStr(a.createTime);
    if (period === 'today' && d !== today) return false;
    if (period === 'week' && !(d >= wstart && d <= today)) return false;
    if (period === 'month' && d.slice(0, 7) !== ms) return false;
    return true;
  });
  filtered.sort((a, b) => (b.createTime || '').localeCompare(a.createTime || ''));
  document.getElementById('countInfo').textContent = `共 ${filtered.length} 篇`;
  page = 1;
  renderTable();
}

function renderTable() {
  const tb = document.getElementById('tbody');
  tb.innerHTML = '';
  const start = (page - 1) * PAGE_SIZE;
  const rows = filtered.slice(start, start + PAGE_SIZE);
  document.getElementById('empty').style.display = rows.length ? 'none' : 'block';
  rows.forEach(a => {
    const status = a.status === 1 ? '已发布' : '其他';
    const tr = document.createElement('tr');
    const link = a.id ? `https://openlab.cosmoplat.com/article-detils?id=${a.id}&articleType=0` : '#';
    let evalCell = '<td><span class="tag">—</span></td>';
    const rv = REVIEWS[a.id];
    if (rv) {
      const cls = rv.grade === '优秀' ? 'tag g' : rv.grade === '不合格' ? 'tag s' : rv.grade === '合格' ? 'tag o' : 'tag';
      evalCell = `<td><span class="${cls}" title="${escapeHtml(rv.comment)}">${rv.grade} ${rv.score}分</span></td>`;
    }
    tr.innerHTML = `
      <td class="title"><a href="${link}" target="_blank">${escapeHtml(a.title || '')}</a></td>
      <td><span class="tag">${escapeHtml(a.cateName || '未分类')}</span></td>
      <td>${escapeHtml(a.createTime || '')}</td>
      <td><span class="tag">${status}</span></td>
      ${evalCell}
      <td class="num">${fmtNum(a.viewCount)}</td>
      <td class="num">${fmtNum(a.commentCount)}</td>
      <td class="num">${fmtNum(a.favor)}</td>
      <td class="num">${fmtNum(a.collect)}</td>`;
    tb.appendChild(tr);
  });
  const totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
  document.getElementById('pageInfo').textContent = `${page} / ${totalPages}`;
  document.getElementById('prevBtn').disabled = page <= 1;
  document.getElementById('nextBtn').disabled = page >= totalPages;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function renderScore() {
  const tag = document.getElementById('scoreTag');
  if (!SCORE || SCORE.score == null) {
    tag.textContent = '综合评分 —';
    return;
  }
  tag.textContent = `综合评分 ${SCORE.score}分`;
}

function openModal() {
  if (!SCORE || SCORE.score == null) return;
  document.getElementById('modalTitle').textContent = '下周优化建议';
  document.getElementById('modalMeta').textContent =
    `评分周期 ${SCORE.week} · 覆盖 ${SCORE.articleCount} 篇 bot 文章 · 更新于 ${SCORE.updatedAt}`;
  let html = `<div style="font-size:34px;font-weight:800;color:#f59e0b;margin:6px 0 14px">${SCORE.score}<span style="font-size:15px;color:var(--muted)"> / 100 分</span></div>`;
  if (SCORE.avgDimensions) {
    Object.entries(SCORE.avgDimensions).forEach(([name, val]) => {
      const isWeak = (SCORE.weakest || []).includes(name);
      const pct = Math.min(100, val / 20 * 100);
      html += `<div class="dim-bar">
        <span class="name ${isWeak ? 'weak' : ''}">${escapeHtml(name)}${isWeak ? ' ⚠' : ''}</span>
        <div class="track"><div class="fill" style="width:${pct}%"></div></div>
        <span class="val">${val}</span>
      </div>`;
    });
  }
  (SCORE.suggestions || []).forEach(s => { html += `<div class="sugg">${escapeHtml(s)}</div>`; });
  document.getElementById('modalBody').innerHTML = html;
  document.getElementById('modalMask').classList.add('show');
}

document.getElementById('scoreTag').addEventListener('click', openModal);
document.getElementById('modalClose').addEventListener('click', () => document.getElementById('modalMask').classList.remove('show'));
document.getElementById('modalMask').addEventListener('click', e => {
  if (e.target === e.currentTarget) document.getElementById('modalMask').classList.remove('show');
});

document.getElementById('searchInput').addEventListener('input', applyFilters);
document.getElementById('cateFilter').addEventListener('change', applyFilters);
document.getElementById('periodFilter').addEventListener('change', applyFilters);
document.getElementById('prevBtn').addEventListener('click', () => { page--; renderTable(); });
document.getElementById('nextBtn').addEventListener('click', () => { page++; renderTable(); });

document.querySelectorAll('.seg button').forEach(btn => {
  btn.addEventListener('click', () => {
    const kind = btn.dataset.kind;
    const p = btn.dataset.p;
    currentPeriod[kind] = p;
    document.querySelectorAll(`.seg button[data-kind="${kind}"]`).forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderTrendChart(kind);
  });
});

function renderAll() {
  calcStats();
  renderCharts();
  applyFilters();
  document.getElementById('sub').textContent = `账号 ${ARTICLES.length} 篇 · 数据更新 ${document.getElementById('updatedAt') || ''}`;
}

Promise.all([
  fetch('data/articles.json').then(r => r.json()),
  fetch('data/reviews.json').then(r => r.json()).catch(() => ({})),
  fetch('data/bot_score.json').then(r => r.json()).catch(() => null)
])
  .then(([json, reviews, score]) => {
    REVIEWS = reviews || {};
    SCORE = score || null;
    parseData(json);
    renderScore();
    document.getElementById('sub').textContent = `账号 ${json.memberId} · 共 ${json.total} 篇文章 · 数据更新 ${json.updatedAt}`;
  })
  .catch(e => {
    document.getElementById('sub').textContent = '数据加载失败: ' + e.message;
    document.getElementById('tbody').innerHTML = `<tr><td colspan="9">数据加载失败</td></tr>`;
  });
</script>
</body>
</html>
